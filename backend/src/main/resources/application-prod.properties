server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI}

server.forward-headers-strategy=framework
server.tomcat.threads.min-spare=2
spring.data.mongodb.auto-index-creation=false
server.tomcat.threads.max=25
server.tomcat.accept-count=25

ai.service.base-url=${AI_SERVICE_BASE_URL}
forecast.ml.enabled=${ML_FORECAST_ENABLED:true}
forecast.ml.service-url=${ML_FORECAST_SERVICE_URL:${AI_SERVICE_BASE_URL}}
legacy.forecast.enabled=${LEGACY_FORECAST_ENABLED:false}
